name: Build AmpereX APK

on:
  push:
    branches: [main]
    paths:
      - "AmpereX/**"
      - ".github/workflows/main.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test Android app
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Run unit tests
        working-directory: AmpereX
        run: gradle testDebugUnitTest

      - name: Build debug APK
        working-directory: AmpereX
        run: gradle assembleDebug

      - name: Build release APK
        working-directory: AmpereX
        run: gradle assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AmpereX-debug-apk
          path: AmpereX/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: AmpereX-release-apk
          path: AmpereX/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
